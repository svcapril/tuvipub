<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lá số Tử Vi — lập chi tiết, miễn phí</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1>Lá số Tử Vi Đẩu Số</h1>
  <p class="tag">Nhập ngày giờ sinh → lá số 12 cung đủ sao, tứ hóa, đại vận, luận giải. Miễn phí.</p>
  <form id="f">
    <label>Ngày sinh (DL)<input id="d" type="date" required></label>
    <label>Giờ
      <select id="h"></select>
    </label>
    <label>Giới
      <select id="g">
        <option value="male">Nam</option>
        <option value="female">Nữ</option>
      </select>
    </label>
    <button type="submit">Lập lá số</button>
    <span class="err" id="err"></span>
  </form>
</header>

<div id="out" hidden>
  <div class="tabs">
    <button class="tabbtn on" data-tab="chart">Lá số 12 cung</button>
    <button class="tabbtn" data-tab="detail">Luận giải cung chọn</button>
    <button class="tabbtn" data-tab="dv">Đại vận 12 cung</button>
  </div>
  <div id="tabChart" class="grid"></div>
  <div id="tabDetail" class="detail" style="display:none"></div>
  <div id="tabDv" class="dv" style="display:none"></div>
</div>

<script src="iztro.min.js"></script>
<script src="app.js"></script>
</body>
</html>
