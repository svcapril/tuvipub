<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Lập lá số Tử Vi Đẩu Số 12 cung đầy đủ sao, tứ hóa, đại vận, hạn năm. Miễn phí, chạy ngay trong trình duyệt.">
<title>Lá số Tử Vi — lập chi tiết, miễn phí</title>
<link rel="stylesheet" href="app.css?v=8">
</head>
<body>
<header>
  <h1>Lá số Tử Vi Đẩu Số</h1>
  <p class="tag">Nhập ngày giờ sinh → lá số 12 cung đủ sao, tứ hóa, đại vận, hạn năm. Miễn phí.</p>
  <form id="f">
    <label>Ngày sinh (DL)<input type="date" id="d" required></label>
    <label>Giờ
      <select id="h"></select>
    </label>
    <label>Giới
      <select id="g"><option value="male">Nam</option><option value="female">Nữ</option></select>
    </label>
    <button type="submit">Lập lá số</button>
  </form>
  <p id="err" class="err"></p>
</header>

<main id="out" hidden>
  <div class="tabs">
    <button class="tabbtn on" data-tab="chart" type="button">Lá số</button>
    <button class="tabbtn" data-tab="detail" type="button">Luận giải</button>
    <button class="tabbtn" data-tab="dv" type="button">Đại vận</button>
    <button class="tabbtn" data-tab="hn" type="button">Hạn năm</button>
  </div>
  <div id="tabChart" class="tabpane on"></div>
  <div id="tabDetail" class="tabpane pane-detail"></div>
  <div id="tabDv" class="tabpane"></div>
  <div id="tabHn" class="tabpane"></div>
</main>

<script src="iztro.min.js"></script>
<script src="app.js?v=8"></script>
</body>
</html>
